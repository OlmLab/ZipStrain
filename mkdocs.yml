site_name: ZipStrain

theme:
  name: "readthedocs"
  features:
    - toc.integrate
    - navigation.expand

nav:
  - index.md
  - quickstart.md
  - usermanual.md
  - installation.md
  - Tutorial.md
  - tutorial_v2.md
  - downstream.md
  - api.md

markdown_extensions:
  - toc:
      toc_depth: 4
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            heading_level: 3
            show_root_toc_entry: true
