site_name: ZipStrain

theme:
  name: "readthedocs"
  features:
    - toc.integrate
    - navigation.expand

nav:
  - index.md
  - quickstart.md
  - usermanual.md
  - installation.md
  - Tutorial.md
  - expected_output.md
  - downstream.md
  - Parameter selection guide:
      - Profiling parameters:
          - popANI depth bias: parameter_selection/index.md
  - api.md

extra_css:
  - assets/paramsel.css

extra_javascript:
  - assets/paramsel_tabs.js

markdown_extensions:
  - toc:
      toc_depth: 4
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            heading_level: 3
            show_root_toc_entry: true
