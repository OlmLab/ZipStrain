name: Publish Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: parsaghadermazi/zipstrain

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag_suffix: ""
            torch_index_url: https://download.pytorch.org/whl/cpu
            torch_version: 2.6.0+cpu
          - tag_suffix: "-cuda11.8"
            torch_index_url: https://download.pytorch.org/whl/cu118
            torch_version: 2.6.0+cu118
          - tag_suffix: "-cuda12.4"
            torch_index_url: https://download.pytorch.org/whl/cu124
            torch_version: 2.6.0+cu124

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PYPROJECT_VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("zipstrain/pyproject.toml").read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not find version in zipstrain/pyproject.toml")
          print(match.group(1))
          PY
          )
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${PYPROJECT_VERSION}" != "${TAG_VERSION}" ]]; then
              echo "Git tag ${TAG_VERSION} does not match pyproject version ${PYPROJECT_VERSION}" >&2
              exit 1
            fi
          else
            TAG_VERSION="${PYPROJECT_VERSION}"
          fi
          echo "version=${TAG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile/dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            TORCH_INDEX_URL=${{ matrix.torch_index_url }}
            TORCH_VERSION=${{ matrix.torch_version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}${{ matrix.tag_suffix }}
          labels: |
            org.opencontainers.image.title=ZipStrain
            org.opencontainers.image.description=ZipStrain container image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}${{ matrix.tag_suffix }}
