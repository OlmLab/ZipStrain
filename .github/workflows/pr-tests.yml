name: Pull Request Tests

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: zipstrain/pyproject.toml

      - name: Install samtools
        run: |
          sudo apt-get update
          sudo apt-get install -y samtools

      - name: Set up Java for Nextflow
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Nextflow
        env:
          NXF_VER: "24.10.0"
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Install ZipStrain with test dependencies
        working-directory: zipstrain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,matrix]"

      - name: Run test suite
        working-directory: zipstrain
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m pytest tests -q -rs \
            --cov=src/zipstrain \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: zipstrain/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  rust-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: sudo apt-get install -y libclang-dev

      - name: Install ZipStrain and Maturin
        working-directory: zipstrain
        run: |
          python -m pip install -e ".[test]"
          python -m pip install 'maturin>=1.8,<2'

      - name: Build and install optional plugin wheel
        working-directory: plugins/zipstrain_rust_profiler
        run: |
          maturin build --release --strip --locked --compatibility linux --out "$RUNNER_TEMP/rust-plugin-wheels"
          python -m pip install --no-deps "$RUNNER_TEMP"/rust-plugin-wheels/*.whl

      - name: Test Rust profiler and Python parity
        run: python -m pytest plugins/zipstrain_rust_profiler/tests -q -rs
