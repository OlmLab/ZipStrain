name: Publish PyPI Package

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip poetry

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail
          PYPROJECT_VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("zipstrain/pyproject.toml").read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not find version in zipstrain/pyproject.toml")
          print(match.group(1))
          PY
          )
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${PYPROJECT_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "Git tag ${TAG_VERSION} does not match pyproject version ${PYPROJECT_VERSION}" >&2
            exit 1
          fi

      - name: Build distribution artifacts with Poetry
        working-directory: zipstrain
        run: |
          poetry check
          poetry build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: zipstrain/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/zipstrain

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
