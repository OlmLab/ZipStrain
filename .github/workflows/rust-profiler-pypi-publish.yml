name: Publish Rust profiler plugin

on:
  push:
    tags:
      - "rust-profiler-v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release tag and core dependency
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          import urllib.request
          from pathlib import Path

          project = tomllib.loads(Path("plugins/zipstrain_rust_profiler/pyproject.toml").read_text())
          version = project["project"]["version"]
          expected_tag = f"rust-profiler-v{version}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(f"Expected tag {expected_tag}")

          with urllib.request.urlopen("https://pypi.org/pypi/zipstrain/json", timeout=30) as response:
              releases = json.load(response)["releases"]
          if not any(
              release in releases and any(not artifact["yanked"] for artifact in releases[release])
              for release in ("1.2.0",)
          ):
              raise SystemExit("Publish ZipStrain 1.2.0 before releasing this plugin")
          PY

  wheels:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64
            platform: linux
          - runner: macos-15-intel
            target: x86_64
            platform: macos
          - runner: macos-latest
            target: aarch64
            platform: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: plugins/zipstrain_rust_profiler
          target: ${{ matrix.target }}
          manylinux: "2_28"
          before-script-linux: dnf install -y clang-devel
          args: --release --locked --strip --compatibility pypi --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: plugins/zipstrain_rust_profiler/dist/*.whl
          if-no-files-found: error

  sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: plugins/zipstrain_rust_profiler
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist-rust-profiler
          path: plugins/zipstrain_rust_profiler/dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-rust-profiler
      url: https://pypi.org/project/zipstrain-rust-profiler/
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
