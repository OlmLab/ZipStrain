[project]
name = "zipstrain"
version = "0.11.1"
description = "Fast strain-level metagenomic profiling and comparison"
authors = [
    {name = "Parsa Ghadermazi", email = "54489047+ParsaGhadermazi@users.noreply.github.com"},
    {name = "Matt Olm", email = "mattolm@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "metagenomics",
    "strain",
    "microbiome",
    "bioinformatics",
    "popANI",
    "SNV",
    "comparative genomics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "polars (>=1.34.0)",
    "plotly (>=6.3.1,<7.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "numpy (>=2.3.4,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "pyarrow (>=22.0.0,<23.0.0)",
    "scipy (>=1.16.2,<2.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "rich (>=14.2.0,<15.0.0)",
    "psutil (>=7.1.2,<8.0.0)",
    "click (>=8.3.1,<9.0.0)",
    "duckdb (>=1.1,<2.0.0)",
]

[project.optional-dependencies]
matrix = [
    "torch (>=2.6,<3.0.0)",
    "h5py (>=3.8)",
]
test = [
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-cov (>=5.0.0,<6.0.0)",
]

[project.urls]
Homepage = "https://github.com/OlmLab/ZipStrain"
Documentation = "https://olmlab.github.io/ZipStrain/"
Repository = "https://github.com/OlmLab/ZipStrain"
"Bug Tracker" = "https://github.com/OlmLab/ZipStrain/issues"

[project.scripts]
zipstrain = "zipstrain.cli:cli"

[tool.poetry]
packages = [{include = "zipstrain", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
